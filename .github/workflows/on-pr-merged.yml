name: on-pr-merged
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  update-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Close the loop on issues, unblock dependents, write the ledger line
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/backlog/backlog.py on-merged --pr "${{ github.event.pull_request.number }}"
